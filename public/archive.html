<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiv | Protokoll-Tool</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .archive-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }
        
        .header h1 {
            color: #2c3e50;
            margin: 0;
        }
        
        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-back {
            background: #95a5a6;
            color: white;
        }
        
        .btn-back:hover {
            background: #7f8c8d;
        }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c0392b;
        }
        
        .btn-delete:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        .session-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .session-table th {
            background: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        
        .session-table th:first-child {
            width: 40px;
            text-align: center;
        }
        
        .session-table td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 13px;
        }
        
        .session-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .session-table input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .session-icon {
            font-size: 24px;
            margin-right: 8px;
        }
        
        .session-type {
            display: flex;
            align-items: center;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .badge-completed {
            background: #27ae60;
            color: white;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .stat-label {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="archive-container">
        <div class="header">
            <h1>📦 Archiv - Abgeschlossene Prüfungen</h1>
            <button class="btn btn-back" onclick="goBack()">← Zurück</button>
        </div>
        
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="totalSessions">0</div>
                <div class="stat-label">Gesamt</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="selectedCount">0</div>
                <div class="stat-label">Ausgewählt</div>
            </div>
        </div>
        
        <div class="action-bar">
            <button class="btn btn-delete" id="deleteBtn" onclick="deleteSelected()" disabled>
                🗑 Ausgewählte löschen
            </button>
        </div>
        
        <div id="tableContainer">
            <div class="loading">Lade abgeschlossene Sessions...</div>
        </div>
    </div>

    <script>
        // Auth-Check
        if (!sessionStorage.getItem('authenticated')) {
            window.location.href = 'index.html';
        }
        
        let sessions = [];
        let selectedIds = new Set();
        
        const examTypeIcons = {
            'tanz': '💃',
            'sportspiele': '⚽',
            'englisch': '🗣️'
        };
        
        const examTypeNames = {
            'tanz': 'Tanz',
            'sportspiele': 'Sportspiele',
            'englisch': 'Englisch'
        };
        
        async function loadCompletedSessions() {
            try {
                const response = await fetch('/api/sessions-completed');
                const data = await response.json();
                
                if (data.success) {
                    sessions = data.sessions;
                    displaySessions();
                } else {
                    showError('Fehler beim Laden: ' + data.error);
                }
            } catch (error) {
                console.error('Fehler:', error);
                showError('Verbindungsfehler: ' + error.message);
            }
        }
        
        function displaySessions() {
            const container = document.getElementById('tableContainer');
            const stats = document.getElementById('stats');
            
            if (sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>Keine abgeschlossenen Prüfungen</h3>
                        <p>Hier erscheinen Prüfungen, die Sie beendet haben.</p>
                    </div>
                `;
                stats.style.display = 'none';
                return;
            }
            
            stats.style.display = 'flex';
            document.getElementById('totalSessions').textContent = sessions.length;
            
            const table = `
                <table class="session-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" onchange="toggleAll()"></th>
                            <th>Prüfungsart</th>
                            <th>Datum</th>
                            <th>Prüfer/-in</th>
                            <th>Anzahl Prüflinge</th>
                            <th>Abgeschlossen am</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sessions.map(session => {
                            const icon = examTypeIcons[session.exam_type] || '📋';
                            const typeName = examTypeNames[session.exam_type] || session.exam_type;
                            const datum = new Date(session.datum).toLocaleDateString('de-DE');
                            const completedAt = new Date(session.completed_at).toLocaleString('de-DE');
                            const prueflingCount = session.pruefling_count || 0;
                            
                            return `
                                <tr>
                                    <td style="text-align: center;">
                                        <input type="checkbox" 
                                               value="${session.id}" 
                                               onchange="toggleSelection('${session.id}')">
                                    </td>
                                    <td>
                                        <div class="session-type">
                                            <span class="session-icon">${icon}</span>
                                            ${typeName}
                                        </div>
                                    </td>
                                    <td>${datum}</td>
                                    <td>${session.pruefer}</td>
                                    <td>${prueflingCount}</td>
                                    <td>${completedAt}</td>
                                    <td><span class="badge badge-completed">Abgeschlossen</span></td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = table;
        }
        
        function toggleAll() {
            const selectAll = document.getElementById('selectAll').checked;
            const checkboxes = document.querySelectorAll('tbody input[type="checkbox"]');
            
            checkboxes.forEach(cb => {
                cb.checked = selectAll;
                if (selectAll) {
                    selectedIds.add(cb.value);
                } else {
                    selectedIds.delete(cb.value);
                }
            });
            
            updateUI();
        }
        
        function toggleSelection(id) {
            const checkbox = document.querySelector(`input[value="${id}"]`);
            
            if (checkbox.checked) {
                selectedIds.add(id);
            } else {
                selectedIds.delete(id);
            }
            
            updateUI();
        }
        
        function updateUI() {
            const deleteBtn = document.getElementById('deleteBtn');
            const selectedCount = document.getElementById('selectedCount');
            
            deleteBtn.disabled = selectedIds.size === 0;
            selectedCount.textContent = selectedIds.size;
        }
        
        async function deleteSelected() {
            if (selectedIds.size === 0) return;
            
            const count = selectedIds.size;
            const message = count === 1 
                ? 'Möchten Sie wirklich 1 Session löschen?' 
                : `Möchten Sie wirklich ${count} Sessions löschen?`;
            
            if (!confirm(message + '\n\nDieser Vorgang kann nicht rückgängig gemacht werden!')) {
                return;
            }
            
            try {
                const response = await fetch('/api/sessions-delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionIds: Array.from(selectedIds)
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`${data.deleted} Session(s) erfolgreich gelöscht.`);
                    selectedIds.clear();
                    await loadCompletedSessions();
                } else {
                    alert('Fehler beim Löschen: ' + data.error);
                }
            } catch (error) {
                alert('Verbindungsfehler: ' + error.message);
            }
        }
        
        function showError(message) {
            document.getElementById('tableContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <h3>Fehler</h3>
                    <p>${message}</p>
                </div>
            `;
        }
        
        function goBack() {
            window.location.href = 'exam-selection.html';
        }
        
        // Init
        loadCompletedSessions();
    </script>
</body>
</html>
