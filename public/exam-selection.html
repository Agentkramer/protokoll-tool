<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prüfungsauswahl | Protokoll-Tool</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .exam-selection-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 14px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }
        
        /* Laufende Sessions */
        .active-sessions {
            margin-bottom: 30px;
        }
        
        .session-list {
            display: grid;
            gap: 12px;
        }
        
        .session-card {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .session-card:hover {
            border-color: #3498db;
            background: #e8f4f8;
            transform: translateX(5px);
        }
        
        .session-icon {
            font-size: 32px;
            margin-right: 15px;
        }
        
        .session-info {
            flex: 1;
        }
        
        .session-title {
            font-weight: 600;
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .session-meta {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .session-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #27ae60;
            color: white;
        }
        
        .no-sessions {
            text-align: center;
            padding: 30px;
            color: #95a5a6;
            font-style: italic;
        }
        
        /* Neue Prüfung starten */
        .exam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .exam-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }
        
        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        
        .exam-card.tanz {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .exam-card.sportspiele {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .exam-card.englisch {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .exam-card.coming-soon {
            background: linear-gradient(135deg, #a8a8a8 0%, #d0d0d0 100%);
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .exam-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .exam-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .exam-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-archive {
            background: #95a5a6;
            color: white;
        }
        
        .btn-archive:hover {
            background: #7f8c8d;
        }
        
        .btn-logout {
            background: #e74c3c;
            color: white;
        }
        
        .btn-logout:hover {
            background: #c0392b;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="exam-selection-container">
        <h1>🎯 Protokoll-Tool</h1>
        <p class="subtitle">Prüfungen verwalten und durchführen</p>
        
        <!-- Laufende Sessions -->
        <div class="section active-sessions" id="activeSessions" style="display: none;">
            <h2>📋 Laufende Prüfungen fortsetzen</h2>
            <div class="session-list" id="sessionList">
                <div class="loading">Lade Sessions...</div>
            </div>
        </div>
        
        <!-- Neue Prüfung starten -->
        <div class="section">
            <h2>➕ Neue Prüfung starten</h2>
            <div class="exam-grid">
                <div class="exam-card tanz" onclick="selectExam('tanz')">
                    <div class="exam-icon">💃</div>
                    <div class="exam-title">Tanz</div>
                    <div class="exam-subtitle">Sportprüfung</div>
                </div>
                
                <div class="exam-card sportspiele" onclick="selectExam('sportspiele')">
                    <div class="exam-icon">⚽</div>
                    <div class="exam-title">Sportspiele</div>
                    <div class="exam-subtitle">Sportprüfung</div>
                </div>
                
                <div class="exam-card englisch coming-soon">
                    <div class="exam-icon">🗣️</div>
                    <div class="exam-title">Englisch</div>
                    <div class="exam-subtitle">Sprechprüfung (bald)</div>
                </div>
                
                <div class="exam-card coming-soon">
                    <div class="exam-icon">➕</div>
                    <div class="exam-title">Weitere</div>
                    <div class="exam-subtitle">In Planung</div>
                </div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-archive" onclick="openArchive()">
                📦 Archiv / Alte Prüfungen verwalten
            </button>
            <button class="btn btn-logout" onclick="logout()">
                Abmelden
            </button>
        </div>
    </div>

    <script>
        // Auth-Check
        const isAuthenticated = sessionStorage.getItem('authenticated');
        if (!isAuthenticated) {
            window.location.href = 'index.html';
        }
        
        // Laufende Sessions laden
        async function loadActiveSessions() {
            try {
                const response = await fetch('/api/sessions-active');
                const data = await response.json();
                
                if (data.success && data.sessions.length > 0) {
                    displayActiveSessions(data.sessions);
                }
            } catch (error) {
                console.error('Fehler beim Laden aktiver Sessions:', error);
            }
        }
        
        function displayActiveSessions(sessions) {
            const container = document.getElementById('activeSessions');
            const list = document.getElementById('sessionList');
            
            container.style.display = 'block';
            
            const examTypeIcons = {
                'tanz': '💃',
                'sportspiele': '⚽',
                'englisch': '🗣️'
            };
            
            const examTypeNames = {
                'tanz': 'Tanz',
                'sportspiele': 'Sportspiele',
                'englisch': 'Englisch'
            };
            
            list.innerHTML = sessions.map(session => {
                const datum = new Date(session.datum).toLocaleDateString('de-DE');
                const icon = examTypeIcons[session.exam_type] || '📋';
                const typeName = examTypeNames[session.exam_type] || session.exam_type;
                
                return `
                    <div class="session-card" onclick="continueSession('${session.id}', '${session.exam_type}')">
                        <div class="session-icon">${icon}</div>
                        <div class="session-info">
                            <div class="session-title">${typeName} - ${datum}</div>
                            <div class="session-meta">
                                Prüfer: ${session.pruefer} | Erstellt: ${new Date(session.created_at).toLocaleString('de-DE')}
                            </div>
                        </div>
                        <div class="session-badge">Fortsetzen →</div>
                    </div>
                `;
            }).join('');
        }
        
        function continueSession(sessionId, examType) {
            sessionStorage.setItem('sessionId', sessionId);
            sessionStorage.setItem('examType', examType);
            window.location.href = examType + '.html';
        }
        
        function selectExam(examType) {
            if (examType === 'tanz' || examType === 'sportspiele') {
                sessionStorage.setItem('examType', examType);
                window.location.href = 'session-setup.html';
            }
        }
        
        function openArchive() {
            window.location.href = 'archive.html';
        }
        
        function logout() {
            sessionStorage.removeItem('authenticated');
            sessionStorage.removeItem('examType');
            sessionStorage.removeItem('sessionId');
            window.location.href = 'index.html';
        }
        
        // Init
        loadActiveSessions();
    </script>
</body>
</html>
