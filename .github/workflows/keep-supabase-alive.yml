
name: Keep Supabase Alive

on:
  schedule:
    - cron: '24 8 * * 2,5'   # Every Tuesday and Friday at 8:24 AM UTC
  workflow_dispatch:          # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/participants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            --fail \
            --silent \
            --show-error
          echo "Ping successful at $(date)"
